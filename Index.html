<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uniconect · Acceso Estudiante</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login">
    <a href="#" class="login__back" aria-label="Volver">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>

    <header class="login__head">
      <div class="login__logo" aria-hidden="true"><span></span></div>
      <p class="login__brand">UNICONECT</p>
      <h1>Estudiante</h1>
      <p class="login__lead">Ingresa con tu correo institucional para continuar como Estudiante.</p>
    </header>

    <form class="panel" id="login">
      <label class="field">
        <span class="field__label">Correo institucional</span>
        <span class="field__box">
          <svg class="field__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input type="email" name="email" placeholder="Ej: nombre@institucion.edu" autocomplete="email" required>
        </span>
      </label>

      <label class="field">
        <span class="field__label">Contraseña</span>
        <span class="field__box">
          <svg class="field__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input type="password" name="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="field__toggle" id="toggle" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </span>
      </label>

      <a href="#" class="panel__forgot">¿Olvidaste tu contraseña?</a>
      <button type="submit" class="btn btn--primary">Iniciar sesión</button>
    </form>

    <div class="quick">
      <p>O accede rápido</p>
      <button type="button" class="btn btn--glass">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.5 3.1-7.5z"/><path fill="#34A853" d="M12 22c2.8 0 5.1-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.7A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.2 13.6a6 6 0 0 1 0-3.8V7.1H2.7a10 10 0 0 0 0 9.2z"/><path fill="#EA4335" d="M12 6c1.5 0 2.9.5 4 1.6l3-3A10 10 0 0 0 2.7 7.1l3.5 2.7C7 7.8 9.3 6 12 6z"/></svg>
        Continuar con Google
      </button>
    </div>

    <p class="login__legal">Al continuar aceptas los <a href="#">Términos de uso</a> y la <a href="#">Política de privacidad</a> de Uniconect.</p>
  </main>

  <script>
    const input = document.getElementById('password');
    document.getElementById('toggle').addEventListener('click', () => {
      input.type = input.type === 'password' ? 'text' : 'password';
    });
    document.getElementById('login').addEventListener('submit', (e) => {
  e.preventDefault();
  window.location.href = 'inicio.html';
});
  </script>
</body>
</html>
